<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efece0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사회 학습방">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23efece0'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23c23b2e' stroke-width='7'/%3E%3Ctext x='50' y='66' font-size='44' font-family='Georgia,serif' text-anchor='middle' fill='%23c23b2e'%3E社%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>사회 학습방</title>
<style>
  :root {
    --paper: #efece0;
    --paper-raised: #faf8ee;
    --ink: #20302a;
    --ink-soft: #5c6a62;
    --teal: #1f6e5c;
    --teal-soft: #dceae4;
    --stamp: #c23b2e;
    --stamp-soft: #f6ddd8;
    --mustard: #b9791f;
    --mustard-soft: #f3e3c2;
    --line: #d9d4c2;
    --shadow: rgba(32, 48, 42, 0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151b18;
      --paper-raised: #1e2622;
      --ink: #e7e4d6;
      --ink-soft: #a9b2aa;
      --teal: #59b79b;
      --teal-soft: #20342d;
      --stamp: #e2685a;
      --stamp-soft: #3a211d;
      --mustard: #e3b65c;
      --mustard-soft: #3a2e17;
      --line: #333f38;
      --shadow: rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151b18;
    --paper-raised: #1e2622;
    --ink: #e7e4d6;
    --ink-soft: #a9b2aa;
    --teal: #59b79b;
    --teal-soft: #20342d;
    --stamp: #e2685a;
    --stamp-soft: #3a211d;
    --mustard: #e3b65c;
    --mustard-soft: #3a2e17;
    --line: #333f38;
    --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Gowun Batang", serif; margin: 0; text-wrap: balance; }
  .mono { font-family: "IBM Plex Mono", "IBM Plex Sans KR", monospace; font-variant-numeric: tabular-nums; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 28px;
    gap: 14px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .seal-mini {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--stamp);
    color: var(--stamp);
    display: flex; align-items: center; justify-content: center;
    font-family: "Gowun Batang", serif; font-size: 17px; font-weight: 700;
    transform: rotate(-6deg);
    flex-shrink: 0;
  }
  .brand h1 { font-size: 19px; color: var(--ink); }
  .dateline { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ghost-btn {
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .ghost-btn.icon-only { width: 34px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .ghost-btn:hover { border-color: var(--teal); color: var(--teal); }
  .ghost-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px;
  }

  #stage { flex: 1; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 18px var(--shadow);
  }

  /* ---- setup ---- */
  .eyebrow {
    font-size: 12px; letter-spacing: 0.06em; color: var(--teal);
    text-transform: uppercase; font-weight: 600; margin: 0 0 6px;
  }
  .setup-lead { font-size: 20px; margin-bottom: 4px; }
  .setup-sub { color: var(--ink-soft); font-size: 13.5px; margin: 6px 0 14px; line-height: 1.5; }
  .suggest-chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--teal-soft); color: var(--teal);
    border: none; border-radius: 10px; padding: 8px 12px;
    font-size: 13px; cursor: pointer; margin-bottom: 12px; text-align: left;
    font-family: inherit;
  }
  .suggest-chip .pg { font-size: 11.5px; opacity: 0.8; }
  textarea#topicInput {
    width: 100%; min-height: 72px; resize: vertical;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--paper); color: var(--ink);
    padding: 12px; font-size: 15px; font-family: inherit; line-height: 1.5;
  }
  .review-row { margin-top: 14px; }
  .review-row-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .review-chip {
    border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); border-radius: 999px; padding: 6px 12px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .review-chip.on { background: var(--mustard-soft); border-color: var(--mustard); color: var(--mustard); }
  .primary-btn {
    display: block; width: 100%; margin-top: 16px;
    background: var(--teal); color: var(--paper-raised);
    border: none; border-radius: 12px; padding: 14px;
    font-size: 15.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .primary-btn:not(:disabled):hover { filter: brightness(1.06); }
  .resume-note {
    background: var(--mustard-soft); color: var(--mustard);
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
    margin-bottom: 14px; line-height: 1.5;
  }
  .setup-note {
    background: var(--stamp-soft); color: var(--stamp);
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
    margin-bottom: 14px; line-height: 1.5;
  }
  .assign-note {
    color: var(--ink-soft); font-size: 12px; margin: -8px 0 14px;
  }

  /* ---- plan (checklist) ---- */
  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--paper); cursor: pointer; text-align: left; font-family: inherit;
  }
  .plan-item:hover { border-color: var(--teal); }
  .plan-item.done { background: var(--teal-soft); border-color: var(--teal); }
  .plan-item.review { background: var(--mustard-soft); border-color: var(--mustard); }
  .plan-item.done, .plan-item.review { cursor: default; pointer-events: none; }
  .plan-status {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-soft);
  }
  .plan-item.done .plan-status { border-color: var(--teal); background: var(--teal); color: #fdfcf6; }
  .plan-item.review .plan-status { border-color: var(--mustard); background: var(--mustard); color: #fdfcf6; }
  .plan-body { flex: 1; min-width: 0; }
  .plan-title { font-size: 14.5px; font-weight: 500; }
  .plan-type { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .plan-chevron { color: var(--ink-soft); font-size: 15px; flex-shrink: 0; }
  .plan-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 10px; }
  .stop-link {
    font-size: 12.5px; color: var(--ink-soft); background: none; border: none;
    text-decoration: underline; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .back-link {
    font-size: 13px; color: var(--ink-soft); background: none; border: none;
    cursor: pointer; font-family: inherit; padding: 4px 0; display: flex; align-items: center; gap: 4px;
  }
  .transcript-item-title { font-size: 12px; color: var(--teal); font-weight: 600; margin-top: 6px; }

  /* ---- active session ---- */
  .session-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .topic-pill {
    font-size: 12.5px; color: var(--ink-soft); background: var(--paper-raised);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    max-width: 68%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .timer-chip {
    font-size: 13px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper-raised);
  }
  .timer-chip.warn { border-color: var(--mustard); color: var(--mustard); }
  .timer-chip.over { border-color: var(--stamp); color: var(--stamp); }

  #chatLog {
    display: flex; flex-direction: column; gap: 10px;
    flex: 1; overflow-y: auto; padding: 4px 2px 8px;
  }
  .bubble { max-width: 84%; padding: 11px 14px; border-radius: 14px; font-size: 15px; line-height: 1.55; }
  .bubble.ai {
    align-self: flex-start; background: var(--paper-raised);
    border: 1px solid var(--line); border-top-left-radius: 4px;
  }
  .bubble.child {
    align-self: flex-end; background: var(--teal); color: #fdfcf6;
    border-top-right-radius: 4px;
  }
  .bubble.thinking { color: var(--ink-soft); font-style: italic; }
  .hint-tag {
    align-self: flex-start; font-size: 11.5px; color: var(--mustard);
    background: var(--mustard-soft); border-radius: 999px; padding: 3px 9px;
    margin-top: -4px;
  }

  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
  .choice-btn {
    border: 1px solid var(--teal); background: var(--teal-soft); color: var(--teal);
    border-radius: 999px; padding: 9px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .choice-btn:hover { background: var(--teal); color: var(--paper-raised); }

  .input-row { display: flex; gap: 8px; align-items: flex-end; padding-top: 4px; border-top: 1px solid var(--line); }
  #childInput {
    flex: 1; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 15px; font-family: inherit; background: var(--paper); color: var(--ink);
    resize: none; max-height: 96px;
  }
  #sendBtn {
    background: var(--teal); color: var(--paper-raised); border: none;
    border-radius: 12px; padding: 0 18px; height: 44px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #cancelThinking {
    display: none; align-self: center; font-size: 12px; color: var(--ink-soft);
    background: none; border: none; text-decoration: underline; cursor: pointer; font-family: inherit;
  }

  /* ---- done / stamp ---- */
  .done-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 12px 0 6px; }
  .stamp {
    width: 122px; height: 122px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Gowun Batang", serif; font-size: 21px; font-weight: 700;
    transform: rotate(-7deg);
    position: relative;
  }
  .stamp::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    background: radial-gradient(circle, transparent 60%, currentColor 61%, transparent 63%);
    opacity: 0.25;
  }
  .stamp.completed { border: 4px solid var(--stamp); color: var(--stamp); }
  .stamp.paused { border: 4px dashed var(--mustard); color: var(--mustard); }
  .done-title { font-size: 22px; }
  .done-sub { color: var(--ink-soft); font-size: 14px; max-width: 320px; line-height: 1.55; }
  .summary-list { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .summary-row { display: flex; gap: 10px; align-items: flex-start; }
  .summary-key { font-size: 12px; color: var(--ink-soft); min-width: 74px; padding-top: 2px; flex-shrink: 0; }
  .summary-val { font-size: 14.5px; line-height: 1.5; }
  .parent-link {
    margin-top: 6px; font-size: 13px; color: var(--teal); background: none;
    border: none; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .transcript-wrap { width: 100%; margin-top: 4px; }
  .transcript-toggle {
    width: 100%; font-size: 13px; color: var(--teal); background: var(--teal-soft);
    border: none; border-radius: 10px; padding: 10px; cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .transcript-box {
    display: flex; flex-direction: column; gap: 8px; text-align: left;
    max-height: 300px; overflow-y: auto; padding: 12px 4px 2px; margin-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .transcript-box .bubble { font-size: 13.5px; max-width: 90%; }

  .empty-note { color: var(--ink-soft); font-size: 13.5px; text-align: center; padding: 30px 10px; }

  /* ---- toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 16px;
    border-radius: 10px; font-size: 13px; max-width: 86%; text-align: center;
    box-shadow: 0 8px 20px var(--shadow); z-index: 50;
  }

  /* ---- overlays ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20, 26, 22, 0.5);
    display: flex; align-items: flex-end; justify-content: center; z-index: 40;
  }
  .overlay-panel {
    background: var(--paper); width: 100%; max-width: 560px;
    max-height: 88dvh; border-radius: 20px 20px 0 0; padding: 18px 18px 26px;
    overflow-y: auto; border: 1px solid var(--line); border-bottom: none;
  }
  .overlay-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .icon-btn { background: none; border: none; font-size: 18px; color: var(--ink-soft); cursor: pointer; padding: 4px; }
  .overlay-panel h3 { font-size: 14px; color: var(--ink-soft); font-family: "IBM Plex Sans KR"; font-weight: 600; margin: 18px 0 10px; }
  .overlay-panel section:first-of-type h3 { margin-top: 0; }
  .hist-row {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .hist-date { font-size: 12.5px; color: var(--ink-soft); }
  .hist-topic { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.completed { background: var(--teal-soft); color: var(--teal); }
  .badge.paused { background: var(--mustard-soft); color: var(--mustard); }
  .badge.active { background: var(--stamp-soft); color: var(--stamp); }
  .rev-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .rev-info { font-size: 13.5px; }
  .rev-due { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .clear-btn {
    font-size: 12px; border: 1px solid var(--line); background: var(--paper-raised);
    color: var(--ink-soft); border-radius: 999px; padding: 5px 10px; cursor: pointer; font-family: inherit;
  }
  .clear-btn:hover { border-color: var(--teal); color: var(--teal); }

  .lookup-row { display: flex; gap: 8px; }
  #lookupDate {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
    color: var(--ink); padding: 9px 10px; font-family: inherit; font-size: 13.5px;
  }
  #lookupBtn {
    border: 1px solid var(--teal); background: var(--teal-soft); color: var(--teal);
    border-radius: 10px; padding: 0 16px; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .lookup-result {
    margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-raised);
  }
  .lookup-topic { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .lookup-meta { font-size: 12.5px; color: var(--ink-soft); }

  #apiKeyInput {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    background: var(--paper); color: var(--ink); padding: 11px 13px;
    font-size: 14px; font-family: inherit; resize: vertical; line-height: 1.5;
  }
  #modelInput {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: var(--paper); color: var(--ink); padding: 9px 11px;
    font-size: 13.5px; font-family: inherit; margin-top: 6px;
  }
  .key-status { font-size: 12.5px; margin-top: 10px; line-height: 1.5; }
  .key-status.ok { color: var(--teal); }
  .key-status.off { color: var(--ink-soft); }

  @media (prefers-reduced-motion: no-preference) {
    .card, .done-wrap { animation: rise 0.35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="sb-shared.js"></script>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal-mini">社</div>
      <div>
        <h1>사회 학습방</h1>
        <p class="dateline mono" id="dateLabel">불러오는 중…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="ghost-btn icon-only" href="index.html" aria-label="담임방으로" title="담임방으로">🏠</a>
      <button class="ghost-btn icon-only" id="settingsBtn" type="button" aria-label="AI 설정" title="AI 설정">⚙</button>
      <button class="ghost-btn" id="parentBtn" type="button">부모님</button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<div class="overlay" id="parentOverlay" hidden>
  <div class="overlay-panel">
    <div class="overlay-head">
      <h2>부모님 리포트</h2>
      <button class="icon-btn" id="closeParent" type="button" aria-label="닫기">✕</button>
    </div>
    <section>
      <h3>최근 학습 기록</h3>
      <div id="historyList"></div>
    </section>
    <section>
      <h3>🔖 복습이 필요해요</h3>
      <div id="reviewList"></div>
    </section>
    <section>
      <h3>📅 지난 기록 날짜로 찾기</h3>
      <div class="lookup-row">
        <input type="date" id="lookupDate">
        <button type="button" id="lookupBtn">조회</button>
      </div>
      <div id="lookupResult"></div>
    </section>
  </div>
</div>

<div class="overlay" id="settingsOverlay" hidden>
  <div class="overlay-panel">
    <div class="overlay-head">
      <h2>AI 설정</h2>
      <button class="icon-btn" id="closeSettings" type="button" aria-label="닫기">✕</button>
    </div>
    <section>
      <h3>Anthropic API 키</h3>
      <p class="setup-sub" style="margin:0 0 10px">
        console.anthropic.com에서 발급받은 API 키를 붙여넣으면 이 기기(브라우저)에 저장되고, 담임방과 다른 과목방들도 같이 사용해요. 서버로 따로 전송되지 않고, 이 브라우저에서 바로 Anthropic API를 호출해요.
      </p>
      <textarea id="apiKeyInput" rows="2" placeholder="sk-ant-..."></textarea>
      <input type="text" id="modelInput" placeholder="모델 (선택, 비워두면 기본값: claude-sonnet-5)">
      <button type="button" class="primary-btn" id="saveKeyBtn">저장</button>
      <button type="button" class="stop-link" id="clearKeyBtn" style="margin-top:10px">키 삭제</button>
      <p class="key-status" id="keyStatus"></p>
    </section>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  var LS = { days: "sr_days_v1", review: "sr_review_v1", pending: "sr_pending_v1" };

  var today = SB.kstDateStr();
  document.getElementById("dateLabel").textContent = SB.kstLabel();

  // this week's known school 사회 progress — a small convenience default.
  // shown only as a tappable suggestion; the child/parent can always type something else.
  var SCHEDULE = {
    "2026-09-01": { topic: "학교생활에서 민주주의를 실천해 볼까요?", pages: "24~27쪽" },
    "2026-09-03": { topic: "단원 마무리 — 학교생활 속 민주주의", pages: "28~29쪽" },
    "2026-09-04": { topic: "주민 자치란 무엇일까요? (새 주제 도입)", pages: "30~33쪽" }
  };

  // ---------- sr-specific storage (this subject's own detailed records) ----------
  function getDay(date) {
    var days = SB.lsGet(LS.days, {});
    return days[date] || null;
  }
  function setDay(date, data) {
    var days = SB.lsGet(LS.days, {});
    days[date] = data;
    SB.lsSet(LS.days, days);
  }
  function updateDay(date, partial) {
    var days = SB.lsGet(LS.days, {});
    var cur = days[date] || {};
    for (var k in partial) if (Object.prototype.hasOwnProperty.call(partial, k)) cur[k] = partial[k];
    cur.updatedAt = Date.now();
    days[date] = cur;
    SB.lsSet(LS.days, days);
  }
  function getRecentDays(n) {
    var days = SB.lsGet(LS.days, {});
    var list = Object.keys(days).map(function (d) { return days[d]; });
    list.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    return list.slice(0, n);
  }
  function getPendingMeta() { return SB.lsGet(LS.pending, null); }
  function setPendingMeta(v) { SB.lsSet(LS.pending, v); }

  function getAllReview() { return SB.lsGet(LS.review, []); }
  function saveAllReview(arr) { SB.lsSet(LS.review, arr); }
  function addReview(doc) {
    var arr = getAllReview();
    var id = "rv" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var rec = { id: id };
    for (var k in doc) rec[k] = doc[k];
    arr.push(rec);
    saveAllReview(arr);
    return id;
  }
  function updateReview(id, partial) {
    var arr = getAllReview();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { for (var k in partial) arr[i][k] = partial[k]; break; }
    }
    saveAllReview(arr);
  }
  function getReviewCandidatesFor(dateStr) {
    return getAllReview()
      .filter(function (r) { return r.status === "pending" && r.dueDate <= dateStr; })
      .slice(0, 10)
      .map(function (r) { return { id: r.id, concept: r.concept }; });
  }
  function getPendingReviewsAll() {
    return getAllReview().filter(function (r) { return r.status === "pending"; });
  }

  // ---------- state ----------
  var apiKey = "";
  var dayData = null;
  var pendingNextStart = null;
  var reviewCandidates = []; // {id, concept}
  var selectedReview = [];
  var timerHandle = null;
  var currentAbort = null;

  var stage = document.getElementById("stage");
  var toastEl = document.getElementById("toast");

  function showToast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.hidden = true; }, ms || 3200);
  }

  function typeLabel(type) {
    return type === "understand" ? "이해 확인" : type === "review" ? "복습" : "연습 문제";
  }

  // ---------- init ----------
  function init() {
    SB.migrateLegacyKey("sr_api_key_v1", "sr_model_v1");
    apiKey = SB.getApiKey();

    dayData = getDay(today);
    var pend = getPendingMeta();
    pendingNextStart = pend ? pend.nextStart : null;
    reviewCandidates = getReviewCandidatesFor(today);

    if (dayData && dayData.state === "done") {
      renderDone(dayData);
    } else if (dayData && dayData.state === "active" && dayData.plan) {
      if (dayData.currentItemId) {
        var item = findItem(dayData.currentItemId);
        if (item && item.status === "pending") { renderProblem(item); return; }
      }
      renderPlan();
    } else {
      renderSetup();
    }
  }

  function findItem(id) {
    return (dayData.plan || []).filter(function (it) { return it.id === id; })[0] || null;
  }

  // ---------- views: loading / setup ----------
  function renderLoading(msg) {
    stage.innerHTML = '<div class="card"><p class="empty-note">' + SB.escapeHtml(msg || "사회 학습방을 준비하고 있어요…") + "</p></div>";
  }

  function renderSetup() {
    stopTimer();
    var suggestion = SCHEDULE[today];
    var resumeNoteHtml = "";
    if (pendingNextStart) {
      resumeNoteHtml =
        '<div class="resume-note">▶️ 지난번에 이어서 할 내용이 있어요: <strong>' +
        SB.escapeHtml(pendingNextStart) + "</strong></div>";
    }
    var suggestHtml = "";
    if (suggestion) {
      suggestHtml =
        '<button type="button" class="suggest-chip" id="useSuggestion">📘 오늘 학교 진도: ' +
        SB.escapeHtml(suggestion.topic) + ' <span class="pg">(' + SB.escapeHtml(suggestion.pages) + ")</span></button><br>";
    }
    var reviewHtml = "";
    if (reviewCandidates.length) {
      reviewHtml =
        '<div class="review-row"><p class="review-row-label">🔖 같이 확인하면 좋은 복습 항목 (눌러서 선택)</p><div class="chip-row" id="reviewChips">' +
        reviewCandidates.map(function (r) {
          return '<button type="button" class="review-chip" data-id="' + r.id + '">' + SB.escapeHtml(r.concept) + "</button>";
        }).join("") + "</div></div>";
    }

    var assignment = SB.getTodayAssignment(today);
    var assignNoteHtml = "";
    if (assignment && assignment.subjects && assignment.subjects.indexOf("social") === -1) {
      assignNoteHtml = '<p class="assign-note">오늘 담임방에서는 사회가 배정되지 않았어요. 그래도 계속할 수 있어.</p>';
    }

    stage.innerHTML =
      '<div class="card">' +
      '<p class="eyebrow">오늘의 사회 수업</p>' +
      '<p class="setup-lead">오늘 사회 시간에 뭘 배웠어?</p>' +
      '<p class="setup-sub">배운 내용을 적으면 오늘 할 문제 목록을 먼저 보여줄게. 그중에서 하고 싶은 것부터 골라서 풀면 돼(10~15분).</p>' +
      (apiKey ? "" : '<div class="setup-note">⚙ 아직 AI 선생님 설정이 안 됐어요. 위쪽 <strong>⚙ 설정</strong>에서 API 키를 먼저 넣어줘.</div>') +
      assignNoteHtml +
      resumeNoteHtml + suggestHtml +
      '<textarea id="topicInput" placeholder="예: 지역의 공공기관이 하는 일"></textarea>' +
      '<p class="setup-sub" id="topicError" style="display:none;color:var(--stamp);margin:6px 0 0">' +
      '👆 오늘 배운 내용을 여기에 짧게 적어줘. 적고 나면 내가 그 내용에 맞는 문제 목록을 자동으로 만들어서 아래에 보여줄게.</p>' +
      reviewHtml +
      '<button type="button" class="primary-btn" id="startBtn" disabled>오늘의 문제 목록 만들기</button>' +
      "</div>";

    var topicInput = document.getElementById("topicInput");
    var startBtn = document.getElementById("startBtn");
    var topicError = document.getElementById("topicError");
    if (pendingNextStart) topicInput.value = pendingNextStart;

    function refreshBtn() {
      startBtn.disabled = !apiKey;
      if (topicInput.value.trim()) {
        topicError.style.display = "none";
        topicInput.style.borderColor = "";
      }
    }
    topicInput.addEventListener("input", refreshBtn);
    refreshBtn();

    var sugBtn = document.getElementById("useSuggestion");
    if (sugBtn) sugBtn.addEventListener("click", function () {
      topicInput.value = suggestion.topic + " (" + suggestion.pages + ")";
      refreshBtn();
      topicInput.focus();
    });

    var chipsWrap = document.getElementById("reviewChips");
    if (chipsWrap) {
      chipsWrap.addEventListener("click", function (e) {
        var btn = e.target.closest(".review-chip");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        var idx = selectedReview.indexOf(id);
        if (idx >= 0) { selectedReview.splice(idx, 1); btn.classList.remove("on"); }
        else { selectedReview.push(id); btn.classList.add("on"); }
      });
    }

    startBtn.addEventListener("click", function () {
      if (!apiKey) { openSettings(); return; }
      var topic = topicInput.value.trim();
      if (!topic) {
        if (suggestion) {
          topic = suggestion.topic + " (" + suggestion.pages + ")";
          topicInput.value = topic;
        } else {
          topicError.style.display = "block";
          topicInput.style.borderColor = "var(--stamp)";
          topicInput.focus();
          return;
        }
      }
      startSession(topic);
    });
  }

  // ---------- plan generation ----------
  function buildPlanPrompt(topic) {
    return (
      '초등학교 4학년 학생을 가르치는 사회 과목 전담 개인교사로서, 오늘 학습범위에 맞는 학습 항목 목록을 만들어줘.\n\n' +
      '오늘 학교 사회 시간 학습범위: "' + topic + '"\n\n' +
      '[규칙]\n' +
      '- 문제를 많이 만드는 게 목표가 아니다. 이 범위를 제대로 이해했는지 확인할 항목 1개(type: understand) + 그 안에서 실제로 생각해볼 짧은 연습 문제 2~3개(type: practice), 총 3~4개만 만든다.\n' +
      '- title은 정답이나 문제 내용을 미리 드러내지 않는 5~14자 정도의 짧은 이름으로 쓴다. 예: "다수결의 의미", "학급 회의 사례 찾기".\n' +
      '- 항목들은 너무 겹치지 않게, 오늘 학습범위 안에서 서로 다른 부분을 다룬다.\n' +
      '- 아래 JSON 형식으로만 답한다. 다른 텍스트를 포함하지 않는다.\n\n' +
      '{"items":[{"title":"...","type":"understand"},{"title":"...","type":"practice"}]}'
    );
  }

  async function generatePlan(topic, reviewConcepts) {
    var items = null;
    var ok = false;
    var errCode = apiKey ? null : "no_api_key";
    if (apiKey) {
      try {
        var result = await SB.callClaudeJson([{ role: "user", content: buildPlanPrompt(topic) }], { maxTokens: 600 });
        if (result && Array.isArray(result.items)) {
          items = result.items
            .filter(function (it) { return it && typeof it.title === "string" && it.title.trim(); })
            .slice(0, 4)
            .map(function (it, i) {
              return {
                id: "p" + (i + 1),
                title: it.title.trim(),
                type: (it.type === "understand" || it.type === "review") ? it.type : "practice",
                status: "pending", hintCount: 0, turns: []
              };
            });
          if (items.length) ok = true; else errCode = "empty_items";
        } else {
          errCode = "no_items_field";
        }
      } catch (e) {
        errCode = (e && e.code) || "unknown";
      }
    }
    if (!items || !items.length) {
      items = [{ id: "p1", title: "오늘 배운 내용 확인", type: "understand", status: "pending", hintCount: 0, turns: [] }];
    }
    if (reviewConcepts && reviewConcepts.length) {
      var reviewItems = reviewConcepts.slice(0, Math.max(1, 4 - items.length)).map(function (c, i) {
        return { id: "r" + (i + 1), title: c, type: "review", status: "pending", hintCount: 0, turns: [] };
      });
      items = items.slice(0, 4 - reviewItems.length).concat(reviewItems);
    }
    return { items: items, ok: ok, errCode: ok ? null : errCode };
  }

  async function startSession(topic) {
    var reviewConcepts = reviewCandidates.filter(function (r) { return selectedReview.indexOf(r.id) >= 0; }).map(function (r) { return r.concept; });
    renderLoading("오늘 할 문제 목록을 만들고 있어요…");
    var planResult = await generatePlan(topic, reviewConcepts);
    dayData = {
      date: today,
      topic: topic,
      reviewConceptsUsed: reviewConcepts,
      startedAt: Date.now(),
      state: "active",
      plan: planResult.items,
      planFallback: !planResult.ok,
      planFallbackReason: planResult.errCode,
      currentItemId: null,
      updatedAt: Date.now()
    };
    setDay(today, dayData);
    setPendingMeta({ nextStart: null, clearedFrom: today });
    pendingNextStart = null;
    SB.setSubjectStatus(today, "social", { status: "in_progress", topic: topic });
    renderPlan();
  }

  async function regeneratePlan() {
    renderLoading("문제 목록을 다시 만들고 있어요…");
    var planResult = await generatePlan(dayData.topic, dayData.reviewConceptsUsed || []);
    dayData.plan = planResult.items;
    dayData.planFallback = !planResult.ok;
    dayData.planFallbackReason = planResult.errCode;
    saveDay({ plan: dayData.plan, planFallback: dayData.planFallback, planFallbackReason: dayData.planFallbackReason });
    renderPlan();
  }

  // ---------- plan (checklist) view ----------
  function renderPlan() {
    stopTimer();
    var pendingLeft = dayData.plan.filter(function (it) { return it.status === "pending"; }).length;
    var fallbackNoticeHtml = dayData.planFallback
      ? '<div class="resume-note">⚠️ 지금 AI 선생님이 문제를 자동으로 만들지 못해서 기본 문제만 준비했어요' +
        (dayData.planFallbackReason ? ' <span class="mono" style="font-size:11px;opacity:0.75">(코드: ' + SB.escapeHtml(dayData.planFallbackReason) + ')</span>' : "") +
        '. <button type="button" class="stop-link" id="regenBtn" style="color:var(--mustard)">다시 만들어보기</button></div>'
      : "";
    stage.innerHTML =
      '<div class="card">' +
      '<div class="session-head" style="margin-bottom:12px">' +
      '<span class="topic-pill" title="' + SB.escapeHtml(dayData.topic) + '">' + SB.escapeHtml(dayData.topic) + "</span>" +
      '<span class="timer-chip mono" id="timerChip">0:00</span>' +
      "</div>" +
      fallbackNoticeHtml +
      '<p class="setup-sub" style="margin:0 0 12px">오늘의 사회 문제야. 하고 싶은 것부터 눌러서 시작해봐.</p>' +
      '<div class="plan-list" id="planList">' +
      dayData.plan.map(planItemHtml).join("") +
      "</div>" +
      '<div class="plan-foot">' +
      '<span class="setup-sub" style="margin:0">' + (pendingLeft === 0 ? "다 했어요! 🎉" : "남은 문제 " + pendingLeft + "개") + "</span>" +
      (pendingLeft > 0 ? '<button type="button" class="stop-link" id="stopBtn">오늘은 여기까지</button>' : "") +
      "</div>" +
      "</div>";

    startTimer(dayData.startedAt);

    document.getElementById("planList").addEventListener("click", function (e) {
      var row = e.target.closest(".plan-item");
      if (!row) return;
      var id = row.getAttribute("data-id");
      var item = findItem(id);
      if (item && item.status === "pending") openItem(item);
    });

    var stopBtn = document.getElementById("stopBtn");
    if (stopBtn) stopBtn.addEventListener("click", function () { finishSession("paused"); });
    var regenBtn = document.getElementById("regenBtn");
    if (regenBtn) regenBtn.addEventListener("click", regeneratePlan);
  }

  function planItemHtml(item) {
    var icon = item.status === "done" ? "✓" : item.status === "review" ? "🔖" : "";
    return (
      '<button type="button" class="plan-item ' + item.status + '" data-id="' + item.id + '">' +
      '<span class="plan-status">' + icon + "</span>" +
      '<span class="plan-body"><span class="plan-title">' + SB.escapeHtml(item.title) + '</span>' +
      '<div class="plan-type">' + typeLabel(item.type) + "</div></span>" +
      (item.status === "pending" ? '<span class="plan-chevron">›</span>' : "") +
      "</button>"
    );
  }

  // ---------- problem (per-item chat) view ----------
  function openItem(item) {
    dayData.currentItemId = item.id;
    saveDay({ currentItemId: item.id });
    renderProblem(item);
  }

  function renderProblem(item) {
    stage.innerHTML =
      '<div class="card" style="display:flex;flex-direction:column;gap:10px;min-height:60vh">' +
      '<div class="session-head">' +
      '<button type="button" class="back-link" id="backBtn">‹ 목록</button>' +
      '<span class="timer-chip mono" id="timerChip">0:00</span>' +
      "</div>" +
      '<p class="setup-sub" style="margin:0">' + typeLabel(item.type) + " · " + SB.escapeHtml(item.title) + "</p>" +
      '<div id="chatLog"></div>' +
      '<div class="choice-row" id="choiceRow"></div>' +
      '<button type="button" id="cancelThinking">멈추기</button>' +
      '<div class="input-row">' +
      '<textarea id="childInput" rows="1" placeholder="여기에 답을 적어봐"></textarea>' +
      '<button type="button" id="sendBtn">보내기</button>' +
      "</div></div>";

    startTimer(dayData.startedAt);

    if (item.turns && item.turns.length) {
      item.turns.forEach(function (t) { appendBubble(t.role === "user" ? "child" : "ai", t.display); });
      if (item.hintCount > 0) showHintTag(item.hintCount);
    } else {
      runItemTurn(item, null);
    }

    document.getElementById("backBtn").addEventListener("click", function () {
      dayData.currentItemId = null;
      saveDay({ currentItemId: null });
      renderPlan();
    });
    document.getElementById("sendBtn").addEventListener("click", function () { sendFromInput(item); });
    var input = document.getElementById("childInput");
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendFromInput(item); }
    });
    document.getElementById("cancelThinking").addEventListener("click", function () {
      if (currentAbort) currentAbort.abort();
    });
  }

  function sendFromInput(item) {
    var input = document.getElementById("childInput");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    clearChoices();
    runItemTurn(item, text);
  }

  function appendBubble(kind, text) {
    var chatLog = document.getElementById("chatLog");
    if (!chatLog) return null;
    var div = document.createElement("div");
    div.className = "bubble " + kind;
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }

  function transcriptHtml(turns) {
    if (!turns || !turns.length) return "";
    return turns.map(function (t) {
      var kind = t.role === "user" ? "child" : "ai";
      return '<div class="bubble ' + kind + '">' + SB.escapeHtml(t.display || t.content || "") + "</div>";
    }).join("");
  }

  function planTranscriptHtml(plan) {
    if (!plan || !plan.length) return '<p class="empty-note">저장된 대화가 없어요.</p>';
    var parts = plan.map(function (item) {
      var body = transcriptHtml(item.turns);
      if (!body) return "";
      return '<div class="transcript-item-title">' + SB.escapeHtml(item.title) + "</div>" + body;
    }).filter(Boolean);
    return parts.length ? parts.join("") : '<p class="empty-note">저장된 대화가 없어요.</p>';
  }

  function clearChoices() {
    var row = document.getElementById("choiceRow");
    if (row) row.innerHTML = "";
  }
  function showChoices(item, list) {
    var row = document.getElementById("choiceRow");
    if (!row) return;
    row.innerHTML = list.map(function (c, i) {
      return '<button type="button" class="choice-btn" data-i="' + i + '">' + SB.escapeHtml(c) + "</button>";
    }).join("");
    row.querySelectorAll(".choice-btn").forEach(function (btn, i) {
      btn.addEventListener("click", function () { clearChoices(); runItemTurn(item, list[i]); });
    });
  }

  function setBusy(busy) {
    var sendBtn = document.getElementById("sendBtn");
    var input = document.getElementById("childInput");
    var cancel = document.getElementById("cancelThinking");
    if (sendBtn) sendBtn.disabled = busy;
    if (input) input.disabled = busy;
    if (cancel) cancel.style.display = busy ? "block" : "none";
  }

  // ---------- timer ----------
  function startTimer(startedAt) {
    stopTimer();
    function tick() {
      var chip = document.getElementById("timerChip");
      if (!chip) { stopTimer(); return; }
      var sec = Math.floor((Date.now() - startedAt) / 1000);
      var m = Math.floor(sec / 60), s = sec % 60;
      chip.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      chip.className = "timer-chip mono" + (m >= 15 ? " over" : m >= 10 ? " warn" : "");
    }
    tick();
    timerHandle = setInterval(tick, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
  function elapsedMinutes() { return Math.max(0, Math.round((Date.now() - dayData.startedAt) / 60000)); }

  function saveDay(fields) {
    updateDay(today, fields);
  }

  // ---------- per-item prompt building ----------
  function buildItemRulesTurn(item) {
    return (
      '당신은 초등학교 4학년 학생을 가르치는 사회 과목 전담 개인교사입니다.\n\n' +
      '오늘 학교 사회 시간 학습범위: "' + dayData.topic + '"\n' +
      '지금 다루는 항목: "' + item.title + '" (유형: ' + typeLabel(item.type) + ')\n\n' +
      '[운영 규칙]\n' +
      '1. 목표는 문제를 많이 푸는 게 아니라 제대로 이해하고 스스로 생각하는 힘을 기르는 것이다. 정답을 바로 알려주지 말고 먼저 생각할 기회를 준다.\n' +
      '2. 오답 처리: 1차 오답=작은 힌트 1개만 주고 재도전시킨다. 2차 오답=더 구체적인 힌트나 핵심 개념을 설명하고 재도전시킨다. 3차에도 못 풀면 정답과 원리를 친절히 설명하고, 아이에게 핵심을 자기 말로 한 번 말해보게 한 뒤 이 항목을 종료한다(needsReview:true). 같은 문제로 힌트·재도전을 3회 넘게 반복하지 않는다.\n' +
      '3. 아이가 충분히 이해했음을 보여주면 "하나만 더", "이번엔 다른 예로" 식으로 질문을 계속 이어가지 않는다. 이 항목 하나에 대한 질문/문제 1개면 충분하다.\n' +
      '4. 상태 정보의 경과시간이 10~15분에 가까워지거나 지나면 새로운 심화 내용을 더하지 말고 빠르게 정리한다.\n' +
      '5. 말투는 친절하고 편안하게, 유아적이지 않게 쓴다. 매 reply는 2~4문장 이내로 간결하게. 정답 여부만 보지 말고 아이가 어떻게 생각했는지를 존중한다. 칭찬은 "조건을 정확히 찾았네"처럼 구체적으로 한다. 틀려도 부담이나 실패감을 주지 않는다.\n' +
      '6. 객관식이 자연스러운 질문이면 choices에 2~4개의 짧은 보기를 넣고, 생각을 설명해야 하는 질문이면 choices는 null로 한다.\n' +
      '7. 이 항목이 끝나는 턴(itemDone:true)에만 needsReview 값을 의미 있게 채운다: 3차 오답까지 갔던 경우에만 true, 그 외엔 false.\n' +
      '8. 매 턴 아래 JSON 형식으로만 답한다. JSON 앞뒤로 다른 텍스트를 절대 포함하지 않는다.\n\n' +
      '{"reply":"아이에게 보여줄 말(2~4문장)","choices":["보기1","보기2"] 또는 null,"answerCorrect":true 또는 false 또는 null,"itemDone":true 또는 false,"needsReview":true 또는 false}\n\n' +
      '지금 막 이 항목을 시작하는 시점이야. 위 규칙에 따라 "' + item.title + '"에 관한 질문이나 짧은 문제를 하나 제시해줘.'
    );
  }

  function buildItemStatusLine(item) {
    return "[상태] 경과시간 " + elapsedMinutes() + "분(목표 10~15분) · 이 항목 힌트단계 " + item.hintCount + "/3";
  }

  function itemApiTurns(item) {
    var turns = [{ role: "user", content: buildItemRulesTurn(item) }];
    var recent = item.turns.slice(-16);
    recent.forEach(function (t) { turns.push({ role: t.role, content: t.content }); });
    return turns;
  }

  // ---------- main per-item turn loop ----------
  async function runItemTurn(item, childText) {
    if (childText !== null) {
      if (!apiKey) { showToast("AI 선생님을 쓰려면 설정에서 API 키를 먼저 넣어줘."); openSettings(); return; }
      appendBubble("child", childText);
      item.turns.push({ role: "user", content: buildItemStatusLine(item) + "\n\n아이: " + childText, display: childText });
      saveDay({ plan: dayData.plan });
    }
    await attemptItemCall(item);
  }

  function appendRetryCard(item, errCode) {
    var chatLog = document.getElementById("chatLog");
    if (!chatLog) return;
    var div = document.createElement("div");
    div.className = "bubble ai";
    var msg = document.createElement("div");
    msg.textContent = apiKey ? "선생님이 지금 답을 못 가져왔어요." : "지금은 AI 선생님을 쓸 수 없어요. 설정에서 API 키를 넣어줘.";
    div.appendChild(msg);
    if (errCode) {
      var codeEl = document.createElement("div");
      codeEl.className = "mono";
      codeEl.style.cssText = "font-size:11px;opacity:0.75;margin-top:4px";
      codeEl.textContent = "코드: " + errCode;
      div.appendChild(codeEl);
    }
    if (apiKey) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice-btn";
      btn.style.marginTop = "8px";
      btn.textContent = "다시 시도";
      btn.addEventListener("click", function () { div.remove(); attemptItemCall(item); });
      div.appendChild(btn);
    } else {
      var setBtn = document.createElement("button");
      setBtn.type = "button";
      setBtn.className = "choice-btn";
      setBtn.style.marginTop = "8px";
      setBtn.textContent = "설정 열기";
      setBtn.addEventListener("click", openSettings);
      div.appendChild(setBtn);
    }
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function attemptItemCall(item) {
    if (!apiKey) { appendRetryCard(item, "no_api_key"); return; }

    var thinkingBubble = appendBubble("ai thinking", "생각하는 중…");
    setBusy(true);
    currentAbort = new AbortController();

    var result;
    try {
      result = await SB.callClaudeJson(itemApiTurns(item), { maxTokens: 700, signal: currentAbort.signal });
    } catch (e) {
      thinkingBubble.remove();
      setBusy(false);
      handleApiError(e);
      if (!e || e.code !== "cancelled") appendRetryCard(item, (e && e.code) || "unknown");
      return;
    }
    currentAbort = null;
    thinkingBubble.remove();
    setBusy(false);

    var reply = (result && typeof result.reply === "string" && result.reply.trim()) ? result.reply.trim() : "음… 다시 한 번 말해줄래?";
    var choices = Array.isArray(result && result.choices) ? result.choices.filter(function (c) { return typeof c === "string"; }).slice(0, 4) : null;
    var answerCorrect = result && result.answerCorrect === true ? true : (result && result.answerCorrect === false ? false : null);
    var itemDone = !!(result && result.itemDone);
    var needsReview = !!(result && result.needsReview);

    appendBubble("ai", reply);
    item.turns.push({ role: "assistant", content: reply, display: reply });

    if (answerCorrect === false) { item.hintCount = Math.min(3, item.hintCount + 1); }
    else if (answerCorrect === true) { item.hintCount = 0; }
    if (item.hintCount > 0) showHintTag(item.hintCount); else hideHintTag();

    if (choices && choices.length) showChoices(item, choices); else clearChoices();

    if (itemDone) {
      item.status = needsReview ? "review" : "done";
    }
    saveDay({ plan: dayData.plan });

    if (itemDone) {
      var allResolved = dayData.plan.every(function (it) { return it.status !== "pending"; });
      setTimeout(function () {
        if (allResolved) { finishSession("completed"); }
        else { dayData.currentItemId = null; saveDay({ currentItemId: null }); renderPlan(); }
      }, 1200);
    }
  }

  function showHintTag(n) {
    hideHintTag();
    var chatLog = document.getElementById("chatLog");
    if (!chatLog) return;
    var tag = document.createElement("div");
    tag.className = "hint-tag";
    tag.id = "hintTag";
    tag.textContent = "힌트 " + n + "/3 단계";
    chatLog.appendChild(tag);
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function hideHintTag() {
    var t = document.getElementById("hintTag");
    if (t) t.remove();
  }

  function handleApiError(e) {
    var code = e && e.code;
    if (code === "cancelled") { return; }
    if (code === "no_api_key" || code === "invalid_api_key") {
      showToast(code === "no_api_key" ? "먼저 설정에서 API 키를 넣어줘." : "API 키가 올바르지 않아요. 설정에서 다시 확인해줘.");
      openSettings();
      return;
    }
    if (code === "rate_limited") { showToast("잠시 후 다시 시도해줘."); return; }
    if (code === "invalid_json" || code === "empty_completion" || code === "upstream_error" || code === "network_error") {
      showToast("선생님이 잠깐 답을 못 만들었어요. 다시 한 번 보내볼까?");
      return;
    }
    showToast("문제가 생겼어요. 다시 시도해줘.");
  }

  // ---------- finish / done ----------
  async function finishSession(status) {
    stopTimer();
    var doneItems = dayData.plan.filter(function (it) { return it.status === "done" || it.status === "review"; });
    var reviewItems = dayData.plan.filter(function (it) { return it.status === "review"; });
    var pendingItems = dayData.plan.filter(function (it) { return it.status === "pending"; });

    dayData.state = "done";
    dayData.currentItemId = null;
    dayData.finishedAt = Date.now();
    dayData.doneSummary = {
      status: status,
      learned: doneItems.length ? doneItems.map(function (it) { return it.title; }).join(", ") : "없음",
      reviewNote: reviewItems.length ? reviewItems.map(function (it) { return it.title; }).join(", ") : null,
      nextStart: pendingItems.length ? pendingItems.map(function (it) { return it.title; }).join(", ") : null
    };

    updateDay(today, { state: "done", currentItemId: null, finishedAt: dayData.finishedAt, doneSummary: dayData.doneSummary, plan: dayData.plan });
    for (var i = 0; i < reviewItems.length; i++) {
      addReview({ concept: reviewItems[i].title, addedDate: today, dueDate: SB.addDaysKST(today, 2), status: "pending", sourceDate: today });
    }
    setPendingMeta({ nextStart: (status === "paused" && pendingItems.length) ? pendingItems[0].title : null, sourceDate: today });

    SB.setSubjectStatus(today, "social", {
      status: status === "completed" ? "done" : "paused",
      learned: dayData.doneSummary.learned,
      reviewNote: dayData.doneSummary.reviewNote,
      nextStart: dayData.doneSummary.nextStart
    });

    renderDone(dayData);
  }

  function renderDone(data) {
    stopTimer();
    var status = (data.doneSummary && data.doneSummary.status) || "completed";
    var isPaused = status === "paused";
    var learned = (data.doneSummary && data.doneSummary.learned) || data.topic;
    var reviewNote = data.doneSummary && data.doneSummary.reviewNote;
    var nextStart = data.doneSummary && data.doneSummary.nextStart;

    var rows = [];
    rows.push({ k: "오늘 한 것", v: learned || data.topic });
    rows.push({ k: "🔖 다시 볼 것", v: reviewNote || "없음" });
    if (isPaused && nextStart) rows.push({ k: "▶️ 다음 시작점", v: nextStart });

    stage.innerHTML =
      '<div class="card done-wrap">' +
      '<div class="stamp ' + (isPaused ? "paused" : "completed") + '">' + (isPaused ? "이어서" : "완료") + "</div>" +
      '<h2 class="done-title">' + (isPaused ? "오늘 사회 수업 종료" : "오늘 사회 완료!") + "</h2>" +
      '<p class="done-sub">' + (isPaused ? "여기까지 오늘 시간에 다 봤어. 다음에 이어서 하자!" : "오늘 사회 공부 끝! 수고했어.") + "</p>" +
      '<div class="summary-list">' +
      rows.map(function (r) { return '<div class="summary-row"><span class="summary-key">' + r.k + '</span><span class="summary-val">' + SB.escapeHtml(r.v) + "</span></div>"; }).join("") +
      "</div>" +
      '<div class="transcript-wrap">' +
      '<button type="button" class="transcript-toggle" id="toggleTranscript">오늘 나눈 대화 전체 보기</button>' +
      '<div class="transcript-box" id="transcriptBox" hidden></div>' +
      "</div>" +
      '<button type="button" class="parent-link" id="toTeacher">담임방으로 돌아가기</button>' +
      '<button type="button" class="parent-link" id="toParent">부모님 리포트 보기</button>' +
      "</div>";

    document.getElementById("toTeacher").addEventListener("click", function () { location.href = "index.html"; });
    document.getElementById("toParent").addEventListener("click", openParentView);

    var toggleBtn = document.getElementById("toggleTranscript");
    var box = document.getElementById("transcriptBox");
    var filled = false;
    toggleBtn.addEventListener("click", function () {
      if (!filled) { box.innerHTML = planTranscriptHtml(data.plan); filled = true; }
      box.hidden = !box.hidden;
      toggleBtn.textContent = box.hidden ? "오늘 나눈 대화 전체 보기" : "대화 접기";
    });
  }

  // ---------- parent view ----------
  var overlay = document.getElementById("parentOverlay");
  document.getElementById("parentBtn").addEventListener("click", openParentView);
  document.getElementById("closeParent").addEventListener("click", function () { overlay.hidden = true; });

  var lookupDateInput = document.getElementById("lookupDate");
  lookupDateInput.max = today;
  document.getElementById("lookupBtn").addEventListener("click", lookupByDate);

  function lookupByDate() {
    var resultEl = document.getElementById("lookupResult");
    var picked = lookupDateInput.value;
    if (!picked) { resultEl.innerHTML = '<p class="empty-note">날짜를 먼저 선택해줘.</p>'; return; }
    if (!SB.storageOk) { resultEl.innerHTML = '<p class="empty-note">저장 기능을 사용할 수 없어요.</p>'; return; }
    var v = getDay(picked);
    if (!v) {
      resultEl.innerHTML = '<p class="empty-note">' + SB.fmtShortDate(picked) + '에는 사회 공부 기록이 없어요.</p>';
      return;
    }
    var st = v.state === "done" ? ((v.doneSummary && v.doneSummary.status) || "completed") : "active";
    var badgeLabel = st === "completed" ? "✅ 완료" : st === "paused" ? "⏸️ 이어서" : "⏳ 진행중";
    var learned = (v.doneSummary && v.doneSummary.learned) || v.topic || "";
    var reviewNote = v.doneSummary && v.doneSummary.reviewNote;
    resultEl.innerHTML =
      '<div class="lookup-result">' +
      '<div class="lookup-topic">' + SB.escapeHtml(v.topic || "") + '</div>' +
      '<div class="lookup-meta">' + SB.fmtShortDate(picked) + " · " + badgeLabel + "</div>" +
      '<div class="summary-list" style="margin-top:10px">' +
      '<div class="summary-row"><span class="summary-key">배운 것</span><span class="summary-val">' + SB.escapeHtml(learned) + "</span></div>" +
      (reviewNote ? '<div class="summary-row"><span class="summary-key">🔖 복습</span><span class="summary-val">' + SB.escapeHtml(reviewNote) + "</span></div>" : "") +
      "</div>" +
      '<button type="button" class="transcript-toggle" id="lookupToggleTranscript" style="margin-top:10px">이 날 대화 전체 보기</button>' +
      '<div class="transcript-box" id="lookupTranscriptBox" hidden></div>' +
      "</div>";

    var tBtn = document.getElementById("lookupToggleTranscript");
    var tBox = document.getElementById("lookupTranscriptBox");
    tBtn.addEventListener("click", function () {
      if (!tBox.innerHTML) tBox.innerHTML = v.plan ? planTranscriptHtml(v.plan) : (transcriptHtml(v.turns) || '<p class="empty-note">저장된 대화가 없어요.</p>');
      tBox.hidden = !tBox.hidden;
      tBtn.textContent = tBox.hidden ? "이 날 대화 전체 보기" : "대화 접기";
    });
  }

  function openParentView() {
    overlay.hidden = false;
    var histEl = document.getElementById("historyList");
    var revEl = document.getElementById("reviewList");

    if (!SB.storageOk) {
      histEl.innerHTML = '<p class="empty-note">저장 기능을 사용할 수 없어 기록을 볼 수 없어요.</p>';
      revEl.innerHTML = "";
      return;
    }

    var recent = getRecentDays(14);
    if (!recent.length) {
      histEl.innerHTML = '<p class="empty-note">아직 기록이 없어요.</p>';
    } else {
      histEl.innerHTML = recent.map(function (v) {
        var st = v.state === "done" ? ((v.doneSummary && v.doneSummary.status) || "completed") : "active";
        var badgeLabel = st === "completed" ? "✅ 완료" : st === "paused" ? "⏸️ 이어서" : "⏳ 진행중";
        return '<div class="hist-row"><span class="hist-date mono">' + SB.fmtShortDate(v.date) + '</span>' +
          '<span class="hist-topic">' + SB.escapeHtml(v.topic || "") + '</span>' +
          '<span class="badge ' + st + '">' + badgeLabel + "</span></div>";
      }).join("");
    }

    var pendingReviews = getPendingReviewsAll();
    if (!pendingReviews.length) {
      revEl.innerHTML = '<p class="empty-note">복습할 항목이 없어요.</p>';
    } else {
      var sorted = pendingReviews.slice().sort(function (a, b) { return (a.dueDate || "").localeCompare(b.dueDate || ""); });
      revEl.innerHTML = sorted.map(function (v) {
        return '<div class="rev-row" data-id="' + v.id + '"><div><div class="rev-info">' + SB.escapeHtml(v.concept) + '</div>' +
          '<div class="rev-due mono">확인 예정 ' + SB.fmtShortDate(v.dueDate) + '</div></div>' +
          '<button type="button" class="clear-btn" data-id="' + v.id + '">완료로 표시</button></div>';
      }).join("");
      revEl.querySelectorAll(".clear-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-id");
          updateReview(id, { status: "cleared" });
          btn.closest(".rev-row").remove();
        });
      });
    }
  }

  // ---------- settings (API key, shared) ----------
  var settingsOverlay = document.getElementById("settingsOverlay");
  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("closeSettings").addEventListener("click", function () { settingsOverlay.hidden = true; });

  function openSettings() {
    settingsOverlay.hidden = false;
    document.getElementById("apiKeyInput").value = SB.getApiKey();
    document.getElementById("modelInput").value = SB.getModel();
    updateKeyStatus();
  }
  function updateKeyStatus() {
    var el = document.getElementById("keyStatus");
    if (apiKey) { el.textContent = "✅ API 키가 저장되어 있어요. (담임방과 같이 씀)"; el.className = "key-status ok"; }
    else { el.textContent = "아직 키가 없어요. 키를 넣어야 AI 선생님을 쓸 수 있어요."; el.className = "key-status off"; }
  }
  function refreshStartBtnIfPresent() {
    var btn = document.getElementById("startBtn");
    if (btn) btn.disabled = !apiKey;
    var note = document.querySelector(".setup-note");
    if (note && apiKey) note.remove();
  }

  document.getElementById("saveKeyBtn").addEventListener("click", function () {
    apiKey = document.getElementById("apiKeyInput").value.trim();
    SB.setApiKey(apiKey);
    SB.setModel(document.getElementById("modelInput").value.trim());
    updateKeyStatus();
    refreshStartBtnIfPresent();
    showToast("저장했어요.");
  });
  document.getElementById("clearKeyBtn").addEventListener("click", function () {
    apiKey = "";
    SB.setApiKey("");
    document.getElementById("apiKeyInput").value = "";
    updateKeyStatus();
    refreshStartBtnIfPresent();
  });

  init();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
